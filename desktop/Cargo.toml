[package]
name = "keles-desktop"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Keles HTML/WASM game in its own desktop window"
repository = "https://github.com/fMert/keles"

[dependencies]
include_dir = "0.7.4"
http = "1"

[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.37.1"
wry = "0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
cef = { version = "154.4.0", default-features = false, features = ["linux-x11"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[package.metadata.deb]
maintainer = "fMert <fmert@users.noreply.github.com>"
copyright = "Keles contributors"
license-file = ["../LICENSE", "0"]
depends = "$auto"
section = "games"
assets = [
    ["target/release/keles-desktop", "usr/bin/keles", "755"],
    ["target/release/libcef.so", "usr/lib/keles/libcef.so", "644"],
    ["target/release/*.pak", "usr/lib/keles/", "644"],
    ["target/release/icudtl.dat", "usr/lib/keles/icudtl.dat", "644"],
    ["target/release/v8_context_snapshot.bin", "usr/lib/keles/v8_context_snapshot.bin", "644"],
    ["target/release/locales/en-US.pak", "usr/lib/keles/locales/en-US.pak", "644"],
    ["target/release/chrome-sandbox", "usr/lib/keles/chrome-sandbox", "4755"],
    ["target/release/libvk_swiftshader.so", "usr/lib/keles/libvk_swiftshader.so", "644"],
    ["target/release/libvulkan.so.1", "usr/lib/keles/libvulkan.so.1", "644"],
    ["target/release/vk_swiftshader_icd.json", "usr/lib/keles/vk_swiftshader_icd.json", "644"],
    ["target/release/CREDITS.html", "usr/share/doc/keles-desktop/CREDITS-CEF.html", "644"],
    ["LICENSE-BSD-CEF", "usr/share/doc/keles-desktop/LICENSE-BSD-CEF", "644"],
    ["LICENSE-MIT-CEF-Rust", "usr/share/doc/keles-desktop/LICENSE-MIT-CEF-Rust", "644"],
    ["keles.desktop", "usr/share/applications/keles.desktop", "644"],
    ["../README.md", "usr/share/doc/keles-desktop/README.md", "644"],
    ["LICENSE-MIT-Wry", "usr/share/doc/keles-desktop/LICENSE-MIT-Wry", "644"],
    ["THIRD-PARTY-LICENSES.txt", "usr/share/doc/keles-desktop/THIRD-PARTY-LICENSES.txt", "644"],
    ["../LICENSE-MIT-WebGL2Samples", "usr/share/doc/keles-desktop/LICENSE-MIT-WebGL2Samples", "644"],
    ["../LICENSE-MIT-wasm-bindgen", "usr/share/doc/keles-desktop/LICENSE-MIT-wasm-bindgen", "644"],
]
