[package]
name = "keles"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Keles multiplayer FPS"
repository = "https://github.com/fMert/keles"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
ewebsock = "0.8.0"
glam = "0.33.12"
image = { version = "0.25.6", default-features = false, features = ["png"] }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Location", "MouseEvent", "Window"] }

# Only needed to run the shared logic tests on the build machine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
