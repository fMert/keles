[package]
name = "keles"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
glam = "0.33.12"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = [
    "CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "HtmlButtonElement",
    "HtmlCanvasElement", "HtmlElement", "HtmlImageElement", "HtmlInputElement", "Node",
    "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "WebSocket",
    "WebGl2RenderingContext", "WebGlBuffer",
    "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject",
    "Window",
] }
